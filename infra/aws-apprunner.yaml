AWSTemplateFormatVersion: "2010-09-09"
Description: Signal402 Alexa+ MCP service on App Runner with DynamoDB audit persistence

Parameters:
  ImageIdentifier:
    Type: String
    Description: Full private ECR image URI including tag

Resources:
  PaymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: EntityIndex
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: IdempotencyIndex
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: API key for Signal402 mutation endpoints
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 40

  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullSignal402Image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Signal402Runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt PaymentTable.Arn
                  - !Sub "${PaymentTable.Arn}/index/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApiSecret

  AutoScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: signal402-scaling
      MinSize: 1
      MaxSize: 4
      MaxConcurrency: 80

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: signal402-payment-guard
      AutoScalingConfigurationArn: !GetAtt AutoScaling.AutoScalingConfigurationArn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt ServiceRole.Arn
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000"
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: production
              - Name: HOST
                Value: 0.0.0.0
              - Name: DYNAMODB_TABLE
                Value: !Ref PaymentTable
            RuntimeEnvironmentSecrets:
              - Name: SIGNAL402_API_KEY
                Value: !Ref ApiSecret

Outputs:
  ServiceUrl:
    Description: Public Signal402 web and MCP base URL
    Value: !Sub "https://${Service.ServiceUrl}"
  McpUrl:
    Value: !Sub "https://${Service.ServiceUrl}/mcp"
  TableName:
    Value: !Ref PaymentTable
  ApiSecretArn:
    Value: !Ref ApiSecret
